name: Dummy Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: cx-public-ubuntu-x64
    # Requires required reviewers on the "release" environment (Settings > Environments)
    # so this job pauses for approval before it can create the draft release.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build (dummy)
        run: |
          mkdir -p dist
          echo "Dummy release artifact for ${{ inputs.version }}" > dist/release-notes.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            --draft \
            --title "${{ inputs.version }}" \
            --generate-notes \
            dist/release-notes.txt
