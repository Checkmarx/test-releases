name: Dummy Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Requires required reviewers on the "release" environment (Settings > Environments)
    # so this job pauses for approval before it can create the draft release.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build (dummy)
        run: |
          mkdir -p dist
          echo "Dummy release artifact for ${{ inputs.version }}" > dist/release-notes.txt

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/release-notes.txt
